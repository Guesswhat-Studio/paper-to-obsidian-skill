name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_network_smoke:
        description: "Run arXiv network smoke test"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python scripts
        run: python -m compileall scripts tools

      - name: Check plugin copy is in sync
        run: python tools/sync_plugin.py --check

      - name: Validate repository packaging
        run: python tools/validate_repository.py

      - name: Validate Obsidian schema
        run: python scripts/schema_tool.py --command validate

      - name: Check helper CLIs
        run: |
          python scripts/fetch_arxiv_html.py --help
          python scripts/build_obsidian_payload.py --help
          python scripts/validate_report_quality.py --help
          python scripts/validate_obsidian_payload.py --help
          python scripts/publish_obsidian_payload.py --help

  network-smoke:
    name: arXiv network smoke
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_network_smoke }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Fetch arXiv HTML reading pack
        run: python scripts/fetch_arxiv_html.py 1706.03762 --output .paper-obsidian/arxiv-html-ci --limit 3
